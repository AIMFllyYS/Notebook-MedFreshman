<!doctype html>
<html lang="zh" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Input Field · StudySolo Glass</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:var(--space-3); background:var(--background); color:var(--foreground); font-family:var(--font-sans); position:relative; min-height:100vh; }
.ambient { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob { position:absolute; border-radius:50%; filter:blur(100px); }
.blob.b1 { width:460px; height:460px; left:-90px; top:-130px; background:color-mix(in srgb,var(--primary) 22%,transparent); }
.blob.b2 { width:420px; height:420px; right:-110px; top:30px; background:color-mix(in srgb,var(--accent) 18%,transparent); }
.blob.b3 { width:520px; height:520px; left:28%; bottom:-230px; background:color-mix(in srgb,var(--info) 16%,transparent); }
.sheet { position:relative; z-index:1; }
.row { display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center; margin-bottom:var(--space-3); }
.divider { border:none; border-top:1px solid var(--border); margin:var(--space-3) 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.glass-in { border:1px solid var(--glass-border); background:var(--glass-control-fill); -webkit-backdrop-filter:blur(var(--glass-blur-thin)) saturate(var(--glass-saturate)); backdrop-filter:blur(var(--glass-blur-thin)) saturate(var(--glass-saturate)); box-shadow:var(--shadow-1); }
.search-pill { display:flex; align-items:center; gap:var(--space-2); flex:1 1 260px; min-width:240px; height:40px; padding:0 var(--space-4); border-radius:var(--radius-pill); }
.search-pill > svg { flex-shrink:0; color:var(--color-muted-foreground); }
.search-pill input { flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--foreground); font-family:var(--font-sans); font-size:var(--font-size-body); caret-color:var(--primary); }
.search-pill input::placeholder { color:var(--color-muted-foreground); }
.kbd { flex-shrink:0; padding:var(--space-1) var(--space-2); border:1px solid var(--glass-border); border-radius:6px; background:var(--glass-highlight); color:var(--color-muted-foreground); font-family:var(--font-mono); font-size:var(--font-size-mono); line-height:1; white-space:nowrap; }
.text-field { display:flex; align-items:center; gap:var(--space-2); flex-shrink:0; width:280px; height:40px; padding:0 var(--space-3); border-radius:var(--radius-control); transition:border-color .15s,box-shadow .15s,background .15s; }
.text-field.is-focused { border-color:color-mix(in srgb,var(--primary) 45%,transparent); background:var(--glass-popover-fill); box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent); }
.grow { flex:1; min-width:0; }
.caret { flex-shrink:0; width:2px; height:18px; border-radius:1px; background:var(--primary); animation:caret-blink 1.1s steps(1) infinite; }
@keyframes caret-blink { 50% { opacity:0; } }
.icon-btn { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; padding:0; border:none; border-radius:var(--radius-pill); background:transparent; color:var(--color-muted-foreground); cursor:pointer; transition:background .15s; }
.icon-btn:hover { background:var(--secondary); }
.composer { width:100%; display:flex; flex-direction:column; justify-content:space-between; gap:var(--space-4); min-height:120px; padding:var(--space-4); border:1px solid var(--glass-border); border-radius:20px; background:var(--glass-panel-fill); -webkit-backdrop-filter:blur(var(--glass-blur-base)) saturate(var(--glass-saturate)); backdrop-filter:blur(var(--glass-blur-base)) saturate(var(--glass-saturate)); box-shadow:inset 0 1px 0 var(--glass-highlight),var(--shadow-2); }
.composer .ph { color:var(--color-muted-foreground); font-size:var(--font-size-body); }
.toolbar { display:flex; align-items:center; gap:var(--space-2); }
.spacer { flex:1; min-width:0; }
.ghost-chip { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-1); height:28px; min-width:28px; padding:0 var(--space-3); border:1px solid var(--glass-border); border-radius:var(--radius-pill); background:transparent; color:var(--color-muted-foreground); font-family:var(--font-sans); font-size:var(--font-size-caption); white-space:nowrap; cursor:pointer; transition:background .15s; }
.ghost-chip.icon { width:28px; padding:0; }
.ghost-chip:hover { background:var(--secondary); }
.send { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border:none; border-radius:var(--radius-pill); background:var(--primary); color:var(--primary-foreground); box-shadow:var(--shadow-1); cursor:pointer; transition:filter .15s; }
.send:hover { filter:brightness(1.08); }
/* @component-css-end */
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="sheet">
  <div class="row">
    <div class="glass-in search-pill" data-evidence-sample="search-pill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="搜索课程、笔记、对话" aria-label="搜索课程、笔记、对话">
      <span class="kbd">⌘K</span>
    </div>
    <div class="glass-in text-field is-focused" data-evidence-sample="text-field-focus">
      <span class="caret"></span><span class="grow"></span>
      <button class="icon-btn" type="button" aria-label="clear"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <div class="composer" data-evidence-sample="composer">
      <div class="ph">给 Agent 发送消息…</div>
      <div class="toolbar">
        <button class="ghost-chip" type="button">Full access</button>
        <button class="ghost-chip icon" type="button" aria-label="model"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg></button>
        <span class="spacer"></span>
        <button class="send" type="button" aria-label="发送"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
