  <script>
/* 跨屏导航：保持当前主题后缀 */
(function(){
  var suffix=/-aqua\.html(?:[?#]|$)/.test(location.pathname)?'-aqua'
            :/-cream\.html(?:[?#]|$)/.test(location.pathname)?'-cream':'';
  document.querySelectorAll('.seg-i[data-goto]').forEach(function(a){
    var t=a.getAttribute('data-goto');
    a.setAttribute('href',(t==='agent'?'agent-workspace':'studio-shelf')+suffix+'.html');
  });

  /* 年级 / 学期分段单选 */
  document.querySelectorAll('.pg-seg-year,.pg-seg-term').forEach(function(seg){
    seg.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
        b.classList.add('on');
      });
    });
  });

  /* 书架视图切换按钮的选中态 */
  document.querySelectorAll('.pg-head-btns .pg-vti').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.pg-head-btns .pg-vti').forEach(function(x){x.classList.remove('on')});
      btn.classList.add('on');
    });
  });

  /* 学科树：展开/收起（data-parents 支持空格分隔的多父级） */
  function collapsedGroups(){
    var s={};
    document.querySelectorAll('.pg-trow.is-collapsed[data-group]').forEach(function(h){s[h.getAttribute('data-group')]=1});
    return s;
  }
  function syncTree(){
    var c=collapsedGroups();
    document.querySelectorAll('.pg-trow[data-parents]').forEach(function(row){
      var keys=row.getAttribute('data-parents').split(/\s+/);
      var hidden=keys.some(function(k){return c[k]});
      row.style.display=hidden?'none':'';
    });
  }
  document.querySelectorAll('.pg-trow[data-group]').forEach(function(head){
    head.addEventListener('click',function(){
      var collapsed=head.classList.toggle('is-collapsed');
      var caret=head.querySelector('.caret');
      if(caret){
        var base=head.classList.contains('expanded')?'rotate(0deg)':'';
        caret.style.transform=collapsed?'rotate(-90deg)':base;
      }
      syncTree();
    });
  });

  /* 点击书卡进入 Agent 工作区（同主题） */
  document.querySelectorAll('.pg-book').forEach(function(card){
    card.addEventListener('click',function(){
      location.href='agent-workspace'+suffix+'.html';
    });
  });
})();
